{% extends "base.html" %}
{% block title %}Şifremi Unuttum - Kredi Kartı Takip{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1>Şifremi Unuttum</h1>
        <p>Şifrenizi sıfırlamak için hesabınızın kullanıcı adını ve kayıtlı e-postasını girin.</p>
        <form method="POST">
            <div class="form-group">
                <label for="username">Kullanıcı Adı</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="email">Kayıtlı E-posta</label>
                <input type="email" id="email" name="email" required autocomplete="email">
            </div>
            <button type="submit" class="btn btn-primary btn-full">Devam Et</button>
        </form>
        <p class="auth-link"><a href="{{ url_for('auth.login') }}">Giriş sayfasına dön</a></p>
    </div>
</div>
{% endblock %}
