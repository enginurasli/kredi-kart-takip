{% extends "base.html" %}
{% block title %}{% if card_id %}Kart Düzenle{% else %}Yeni Kart Ekle{% endif %} - Kredi Kartı Takip{% endblock %}
{% block content %}
<div class="page-header">
    <h1 id="formTitle">Yeni Kart Ekle</h1>
</div>

<div class="form-container">
    <form id="cardForm" onsubmit="submitCard(event)">
        <div class="form-group">
            <label for="bank_name">Banka Adı</label>
            <input type="text" id="bank_name" name="bank_name" required
                   placeholder="Örn: Garanti, Yapı Kredi, Akbank">
        </div>

        <div class="form-group">
            <label for="card_name">Kart Adı</label>
            <input type="text" id="card_name" name="card_name" required
                   placeholder="Örn: Bonus, World, Axess">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="statement_day">Hesap Kesim Günü</label>
                <input type="number" id="statement_day" name="statement_day" required
                       min="1" max="31" placeholder="15">
            </div>
            <div class="form-group">
                <label for="due_day">Son Ödeme Günü</label>
                <input type="number" id="due_day" name="due_day" required
                       min="1" max="31" placeholder="25">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="current_balance">Güncel Borç</label>
                <input type="number" id="current_balance" name="current_balance" required
                       min="0" step="0.01" placeholder="18750">
            </div>
            <div class="form-group">
                <label for="currency">Para Birimi</label>
                <select id="currency" name="currency">
                    <option value="TRY" selected>TRY</option>
                    <option value="USD">USD</option>
                    <option value="EUR">EUR</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="reminder_days">Hatırlatma (gün önce)</label>
            <input type="number" id="reminder_days" name="reminder_days"
                   min="1" max="30" value="2" placeholder="2">
        </div>

        <div class="form-group">
            <label for="note">Not</label>
            <textarea id="note" name="note" rows="3"
                      placeholder="İsteğe bağlı not..."></textarea>
        </div>

        <div class="form-group">
            <label class="checkbox-label">
                <input type="checkbox" id="is_active" name="is_active" checked>
                Aktif
            </label>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary btn-full" id="submitBtn">Kaydet</button>
            <a href="{{ url_for('main.cards') }}" class="btn btn-secondary btn-full">İptal</a>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
const cardId = {{ card_id|tojson }};
let isEditing = false;

document.addEventListener('DOMContentLoaded', async function() {
    if (cardId) {
        isEditing = true;
        document.getElementById('formTitle').textContent = 'Kart Düzenle';
        document.getElementById('submitBtn').textContent = 'Güncelle';

        try {
            const res = await fetch(`/api/cards/${cardId}`);
            const card = await res.json();

            document.getElementById('bank_name').value = card.bank_name;
            document.getElementById('card_name').value = card.card_name;
            document.getElementById('statement_day').value = card.statement_day;
            document.getElementById('due_day').value = card.due_day;
            document.getElementById('current_balance').value = card.current_balance;
            document.getElementById('currency').value = card.currency;
            document.getElementById('reminder_days').value = card.reminder_days;
            document.getElementById('note').value = card.note || '';
            document.getElementById('is_active').checked = card.is_active;
        } catch (err) {
            console.error('Kart yükleme hatası:', err);
        }
    }
});

async function submitCard(e) {
    e.preventDefault();

    const data = {
        bank_name: document.getElementById('bank_name').value,
        card_name: document.getElementById('card_name').value,
        statement_day: parseInt(document.getElementById('statement_day').value),
        due_day: parseInt(document.getElementById('due_day').value),
        current_balance: parseFloat(document.getElementById('current_balance').value),
        currency: document.getElementById('currency').value,
        reminder_days: parseInt(document.getElementById('reminder_days').value) || 2,
        note: document.getElementById('note').value,
        is_active: document.getElementById('is_active').checked,
    };

    try {
        const url = isEditing ? `/api/cards/${cardId}` : '/api/cards';
        const method = isEditing ? 'PUT' : 'POST';

        const res = await fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        if (res.ok) {
            window.location.href = '/cards';
        } else {
            const err = await res.json();
            alert(err.error || 'Bir hata oluştu');
        }
    } catch (err) {
        console.error('Kaydetme hatası:', err);
    }
}
</script>
{% endblock %}
