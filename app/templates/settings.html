{% extends "base.html" %}
{% block title %}Ayarlar - Kredi Kartı Takip{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Ayarlar</h1>
</div>

<div class="settings-container">
    <form id="settingsForm" onsubmit="saveSettings(event)">
        <div class="form-group">
            <label class="checkbox-label">
                <input type="checkbox" id="notifications_enabled" checked>
                Bildirimleri Aç
            </label>
        </div>

        <div class="form-group">
            <label for="default_reminder_days">Varsayılan Hatırlatma Günü</label>
            <input type="number" id="default_reminder_days" min="1" max="30" value="2">
        </div>

        <div class="form-group">
            <label for="currency">Varsayılan Para Birimi</label>
            <select id="currency">
                <option value="TRY" selected>TRY</option>
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
            </select>
        </div>

        <div class="form-group">
            <label for="notification_sound">Bildirim Sesi</label>
            <select id="notification_sound">
                <option value="default" selected>Varsayılan</option>
                <option value="none">Sessiz</option>
            </select>
        </div>

        <div class="form-group">
            <label for="theme">Tema</label>
            <select id="theme">
                <option value="light" selected>Açık</option>
                <option value="dark">Koyu</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary btn-full">Kaydet</button>
    </form>

    <div class="settings-section">
        <h3>Bildirim İzinleri</h3>
        <p class="text-muted">Tarayıcı bildirimlerini açmak için izin verin.</p>
        <button class="btn btn-secondary" onclick="requestNotificationPermission()">
            Bildirim İste
        </button>
    </div>

    <div class="settings-section">
        <h3>Hesap</h3>
        <p class="text-muted">Giriş yapan: <strong>{{ current_user.username }}</strong></p>
        <a href="{{ url_for('auth.logout') }}" class="btn btn-danger">Çıkış Yap</a>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', loadSettings);

async function loadSettings() {
    try {
        const res = await fetch('/api/settings');
        const settings = await res.json();

        document.getElementById('notifications_enabled').checked = settings.notifications_enabled;
        document.getElementById('default_reminder_days').value = settings.default_reminder_days;
        document.getElementById('currency').value = settings.currency;
        document.getElementById('notification_sound').value = settings.notification_sound;
        document.getElementById('theme').value = settings.theme;
    } catch (err) {
        console.error('Ayarlar yükleme hatası:', err);
    }
}

async function saveSettings(e) {
    e.preventDefault();

    const data = {
        notifications_enabled: document.getElementById('notifications_enabled').checked,
        default_reminder_days: parseInt(document.getElementById('default_reminder_days').value),
        currency: document.getElementById('currency').value,
        notification_sound: document.getElementById('notification_sound').value,
        theme: document.getElementById('theme').value,
    };

    try {
        const res = await fetch('/api/settings', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        if (res.ok) {
            alert('Ayarlar kaydedildi.');
        }
    } catch (err) {
        console.error('Ayarlar kaydetme hatası:', err);
    }
}

function requestNotificationPermission() {
    if ('Notification' in window) {
        Notification.requestPermission().then(permission => {
            if (permission === 'granted') {
                alert('Bildirim izni verildi.');
            } else {
                alert('Bildirim izni reddedildi.');
            }
        });
    } else {
        alert('Tarayıcınız bildirimleri desteklemiyor.');
    }
}
</script>
{% endblock %}
