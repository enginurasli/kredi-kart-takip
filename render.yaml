services:
  - type: web
    name: kredi-kart-takip
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: kredi-kart-takip-db
    plan: free
    databaseName: kredi_kart_takip
